<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Tickets</title><link rel="stylesheet" href="/styles.css"></head>
<body class="detail-page"><div class="page-shell project-shell"><header class="topbar detail-topbar"><div class="topbar-left"><div class="brand" title="Home"><img class="adani-logo" src="/Adani_logo.png" alt="Adani"></div></div><div class="user-menu-wrap"><button class="user-button" type="button" aria-expanded="false">◔</button><div class="user-menu hidden"><button type="button" class="user-menu-item logout-menu-item">Logout</button></div></div></header>
<main class="detail-content shipping-page"><button id="back-project" type="button" class="secondary-button">Back to Project</button><h1 id="title" class="project-title">Shipping Tickets</h1><p class="shipping-intro">Only assemblies with every available instance marked PASS in inspection can be added to a shipping ticket.</p><form id="ticket-form" class="fitup-panel"><div class="inspection-field-grid"><label>Shipping date<input id="shipping-date" type="date"></label><label>Destination<input id="destination" maxlength="500" placeholder="Delivery location"></label></div><label>Remarks<textarea id="remarks" rows="3" maxlength="4000"></textarea></label><div class="drawings-table-wrap"><table class="drawings-table"><thead><tr><th>Select</th><th>Assembly</th><th>Inspected qty</th><th>Weight</th></tr></thead><tbody id="eligible-rows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div><button type="submit" class="detail-button">Create Shipping Ticket</button><p id="message" role="status"></p></form><section class="inspection-history"><h2>Created Shipping Tickets</h2><div class="drawings-table-wrap"><table class="drawings-table"><thead><tr><th>Ticket</th><th>Date</th><th>Destination</th><th>Assemblies</th><th>Quantity</th><th>Weight</th><th>Created</th></tr></thead><tbody id="ticket-rows"><tr><td colspan="7">Loading...</td></tr></tbody></table></div></section></main></div>
<script src="/time.js"></script><script>
const params=new URLSearchParams(location.search),job=params.get('job')||'',esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const rows=document.getElementById('eligible-rows'),ticketRows=document.getElementById('ticket-rows'),message=document.getElementById('message');document.getElementById('back-project').onclick=()=>location.href='/project.html?job='+encodeURIComponent(job);document.querySelector('.brand').onclick=()=>location.href='/';const wrap=document.querySelector('.user-menu-wrap'),userButton=wrap.querySelector('.user-button'),menu=wrap.querySelector('.user-menu');userButton.onclick=e=>{e.stopPropagation();menu.classList.toggle('hidden')};wrap.querySelector('.logout-menu-item').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/'}};document.addEventListener('click',e=>{if(!wrap.contains(e.target))menu.classList.add('hidden')});
async function load(){if(!job){message.textContent='No project was selected.';return}const r=await fetch('/api/shipping-tickets?job='+encodeURIComponent(job));const p=await r.json();if(!r.ok)throw Error(p.error||'Unable to load shipping tickets.');document.getElementById('title').textContent=job+' Shipping Tickets';rows.innerHTML=p.eligibleAssemblies.length?p.eligibleAssemblies.map(a=>`<tr><td><input type="checkbox" name="assembly" value="${esc(a.qrCode)}"></td><td>${esc(a.assemblyMark)}</td><td>${esc(a.quantity)}</td><td>${Number(a.weight||0).toLocaleString()} kg</td></tr>`).join(''):'<tr><td colspan="4">No fully inspected assemblies are available for shipping.</td></tr>';ticketRows.innerHTML=p.tickets.length?p.tickets.map(t=>`<tr><td>${esc(t.ticketNumber)}</td><td>${esc(t.shippingDate||'—')}</td><td>${esc(t.destination||'—')}</td><td>${esc(t.assemblyCount)}</td><td>${esc(t.quantity)}</td><td>${Number(t.weight||0).toLocaleString()} kg</td><td>${esc(formatIndiaDateTime(t.createdAt))}</td></tr>`).join(''):'<tr><td colspan="7">No shipping tickets created.</td></tr>'}
document.getElementById('ticket-form').onsubmit=async e=>{e.preventDefault();const qrCodes=[...document.querySelectorAll('input[name="assembly"]:checked')].map(x=>x.value);if(!qrCodes.length){message.textContent='Select at least one inspected assembly.';return}message.textContent='Creating shipping ticket...';const r=await fetch('/api/shipping-tickets?job='+encodeURIComponent(job),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qrCodes,shippingDate:document.getElementById('shipping-date').value,destination:document.getElementById('destination').value,remarks:document.getElementById('remarks').value})});const p=await r.json();if(!r.ok){message.textContent=p.error||'Unable to create shipping ticket.';return}message.textContent='Shipping ticket '+p.ticketNumber+' created.';document.getElementById('ticket-form').reset();load()};fetch('/api/auth/me').then(async r=>{if(!r.ok)throw Error();const p=await r.json();userButton.textContent=p.contractor?.contractorName||p.contractor?.username||'User'}).catch(()=>location.href='/?return='+encodeURIComponent(location.pathname+location.search));load().catch(e=>{message.textContent=e.message;rows.innerHTML='<tr><td colspan="4">Unable to load assemblies.</td></tr>'});
</script></body></html>
