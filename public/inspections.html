<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspections</title><link rel="stylesheet" href="/styles.css"></head>
<body class="detail-page"><div class="page-shell project-shell"><header class="topbar detail-topbar"><div class="topbar-left"><button class="menu-button" type="button" aria-label="Open menu">☰</button><div class="brand" aria-label="Tekla PowerFab Go"><div class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></div><div class="brand-text"><span class="tekla">Tekla</span><span class="powerfab">PowerFab</span><span class="go">Go</span></div></div></div><button class="user-button" type="button" aria-label="User profile">◔</button></header>
<nav class="project-nav"><button class="project-nav-item" id="overview-nav">OVERVIEW</button><button class="project-nav-item" id="drawings-nav">DRAWINGS</button><button class="project-nav-item" id="transmittals-nav">TRANSMITTALS</button><button class="project-nav-item active">INSPECTIONS</button></nav>
<main class="detail-content drawings-content"><h1 id="page-title" class="project-title">Loading inspections...</h1><div class="drawings-toolbar"><strong>Inspection records</strong></div><div class="drawings-table-wrap"><table class="drawings-table"><thead><tr><th>Source</th><th>Assembly</th><th>Piece</th><th>Inspection</th><th>Inspector</th><th>Result</th><th>Remarks</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></main></div>
<script>const p=new URLSearchParams(location.search),job=p.get('job')||'',title=document.getElementById('page-title'),rows=document.getElementById('rows');const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');document.getElementById('overview-nav').onclick=()=>location.href=`/project.html?job=${encodeURIComponent(job)}`;document.getElementById('drawings-nav').onclick=()=>location.href=`/drawings.html?job=${encodeURIComponent(job)}`;document.getElementById('transmittals-nav').onclick=()=>location.href=`/transmittals.html?job=${encodeURIComponent(job)}`;fetch(`/api/project-inspections?job=${encodeURIComponent(job)}`).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Unable to load inspections');return x}).then(x=>{const pf=(x.powerFabInspections||[]).map(i=>({source:'PowerFab',assembly:i.MainMark,piece:i.PieceMark,inspection:i.inspectionType,inspector:'—',result:i.TestFailed?'FAIL':'PASS',remarks:'—',date:i.TestDateTime}));const portal=(x.contractorInspections||[]).map(i=>({source:'Contractor',assembly:i.assemblyMark,piece:'—',inspection:'Vendor Fit-up Inspection',inspector:i.inspector,result:i.result,remarks:i.remarks,date:i.createdAt}));const all=[...pf,...portal];title.textContent=`${x.jobNumber} Inspections (${all.length})`;rows.innerHTML=all.length?all.map(i=>`<tr><td>${esc(i.source)}</td><td>${esc(i.assembly)}</td><td>${esc(i.piece)}</td><td>${esc(i.inspection)}</td><td>${esc(i.inspector)}</td><td>${esc(i.result)}</td><td>${esc(i.remarks)}</td><td>${esc(i.date||'—')}</td></tr>`).join(''):'<tr><td colspan="8">No inspection records found.</td></tr>'}).catch(e=>{title.textContent=`${job} Inspections`;rows.innerHTML=`<tr><td colspan="8">${esc(e.message)}</td></tr>`});</script></body></html>
