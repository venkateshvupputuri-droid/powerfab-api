<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shift to Laydown / Site</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body class="detail-page"><div class="page-shell project-shell">
<header class="topbar detail-topbar"><div class="topbar-left"><div class="brand" title="Home" role="button" tabindex="0"><img class="adani-logo" src="/Adani_logo.png" alt="Adani"></div></div><div class="user-menu-wrap"><button class="user-button" type="button" aria-label="User profile">User</button></div></header>
<nav class="project-nav" aria-label="Project sections"><button type="button" class="project-nav-item" id="overview-nav">OVERVIEW</button><button type="button" class="project-nav-item" id="assemblies-nav">ASSEMBLIES</button><button type="button" class="project-nav-item" id="drawings-nav">DRAWINGS</button><button type="button" class="project-nav-item active">SHIFT TO LAYDOWN / SITE</button></nav><main class="detail-content"><button id="back" type="button" class="secondary-button">Back to Project</button><h1 class="project-title">Shift to Laydown / Site</h1><p id="message" role="status">Select a destination workflow.</p><section class="fitup-panel"><h2>Destination</h2><div class="inspection-field-grid"><label><input type="radio" name="destination" value="laydown" checked> Laydown</label><label><input type="radio" name="destination" value="site"> Site</label></div><button id="open" type="button" class="detail-button">Create Load</button></section></main></div><script>
const params=new URLSearchParams(location.search),job=params.get('job')||'';document.getElementById('overview-nav').onclick=()=>location.href=`/project.html?job=${encodeURIComponent(job)}`;document.getElementById('assemblies-nav').onclick=()=>location.href=`/assembly.html?job=${encodeURIComponent(job)}`;document.getElementById('drawings-nav').onclick=()=>location.href=`/drawings.html?job=${encodeURIComponent(job)}`;document.getElementById('back').onclick=()=>location.href='/project.html?job='+encodeURIComponent(job);document.getElementById('open').onclick=()=>{const destination=document.querySelector('input[name="destination"]:checked').value;location.href='/shift-to-paint.html?job='+encodeURIComponent(job)+'&destination='+destination+'&new=1'};fetch('/api/auth/me').then(async response=>{if(!response.ok)throw Error();const auth=await response.json();if(!auth.permissions?.shipping)throw Error('Shipping access is not enabled for this user.')}).catch(error=>{document.getElementById('message').textContent=error.message;document.getElementById('open').disabled=true});
</script></body></html>
