<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmittal Drawings</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="detail-page">
  <div class="page-shell project-shell">
    <header class="topbar detail-topbar">
      <div class="topbar-left">
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <div class="brand" aria-label="Adani Fab & Erection Tracker" title="Adani Fab & Erection Tracker" style="cursor:pointer">
          <div class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></div>
          <div class="brand-text"><span class="tekla">Adani</span><span class="powerfab">Fab &amp; Erection</span><span class="go">Tracker</span></div>
        </div>
      </div>
      <div class="user-menu-wrap">
        <button class="user-button" type="button" aria-label="User profile" aria-expanded="false">◔</button>
        <div class="user-menu hidden" role="menu" aria-label="User menu"><button type="button" class="user-menu-item logout-menu-item">Logout</button></div>
      </div>
    </header>
    <nav class="project-nav" aria-label="Project sections">
      <button type="button" id="overview-nav" class="project-nav-item">OVERVIEW</button>
      <button type="button" id="assemblies-nav" class="project-nav-item">ASSEMBLIES</button>
      <button type="button" id="drawings-nav" class="project-nav-item active">DRAWINGS</button>
      <button type="button" id="fitup-report-nav" class="project-nav-item">FITUP REPORT</button>
      <button type="button" class="project-nav-item">SEQUENCES</button>
      <button type="button" id="inspections-nav" class="project-nav-item">INSPECTIONS</button>
      <button type="button" class="project-nav-item">INSPECTION TEST RECORDS</button>
    </nav>
    <main class="detail-content drawings-content assigned-drawings-content">
      <h1 id="page-title" class="project-title">Loading assigned drawings...</h1>
      <div class="drawings-toolbar assigned-drawings-toolbar">
        <strong>Assigned drawings</strong>
        <label for="description-filter">Description</label>
        <select id="description-filter" aria-label="Filter by description">
          <option value="">All descriptions</option>
        </select>
        <label for="drawing-search">Drawing No</label>
        <input id="drawing-search" type="search" placeholder="Drawing No" aria-label="Filter by drawing number">
        <div class="drawing-actions">
          <button type="button" class="detail-button compact-button" id="select-all">Select all</button>
          <button type="button" class="detail-button compact-button" id="print-all">Print all preview</button>
          <button type="button" class="detail-button compact-button" id="print-selected">Print selected preview</button>
        </div>
      </div>
      <div class="drawings-table-wrap">
        <table class="drawings-table assigned-drawings-table">
          <thead><tr><th>Select</th><th>QR code</th><th>Drawing #</th><th>Instance mark no</th><th>Revision</th><th>Description</th><th>Approval status</th><th>PDF</th></tr></thead>
          <tbody id="drawing-rows"><tr><td colspan="8">Loading drawings...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const jobNumber = params.get('job') || '';
    const transmittalId = params.get('transmittal') || '';
    const title = document.getElementById('page-title');
    const rows = document.getElementById('drawing-rows');
    const search = document.getElementById('drawing-search');
    const descriptionFilter = document.getElementById('description-filter');
    let drawings = [];

    document.querySelector('.brand').onclick = () => { window.location.href = '/'; };
    const userMenuWrap = document.querySelector('.user-menu-wrap');
    const userButton = userMenuWrap.querySelector('.user-button');
    const userMenu = userMenuWrap.querySelector('.user-menu');
    const logoutButton = userMenuWrap.querySelector('.logout-menu-item');
    userButton.onclick = (event) => {
      event.stopPropagation();
      const hidden = userMenu.classList.toggle('hidden');
      userButton.setAttribute('aria-expanded', String(!hidden));
    };
    logoutButton.onclick = async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } finally { window.location.href = '/'; }
    };
    document.addEventListener('click', (event) => {
      if (!userMenuWrap.contains(event.target)) {
        userMenu.classList.add('hidden');
        userButton.setAttribute('aria-expanded', 'false');
      }
    });
    fetch('/api/auth/me').then(async (response) => {
      if (!response.ok) throw new Error('Not authenticated');
      const payload = await response.json();
      const displayName = payload.contractor?.contractorName || payload.contractor?.username || 'User';
      userButton.textContent = displayName;
      userButton.setAttribute('aria-label', `User profile: ${displayName}`);
    }).catch(() => {
      window.location.href = `/?return=${encodeURIComponent(window.location.pathname + window.location.search)}`;
    });

    const escapeHtml = (value) => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    function render() {
      const drawingQuery = search.value.trim().toLowerCase();
      const selectedDescription = descriptionFilter.value;
      const filtered = drawings.filter((drawing) => {
        const matchesDrawingNumber = String(drawing.drawingNumber ?? '').toLowerCase().includes(drawingQuery);
        const matchesDescription = !selectedDescription || String(drawing.description ?? '') === selectedDescription;
        return matchesDrawingNumber && matchesDescription;
      });
      rows.innerHTML = filtered.length ? filtered.map((drawing) => `
        <tr data-row-key="${escapeHtml(drawing.rowKey)}">
          <td><input class="drawing-check" type="checkbox" aria-label="Select ${escapeHtml(drawing.instanceMark || drawing.drawingNumber)}"></td>
          <td><img class="drawing-qr" src="${drawing.qrUrl}" alt="Assembly QR code for ${escapeHtml(drawing.instanceMark || drawing.drawingNumber)}"></td>
          <td><strong>${escapeHtml(drawing.drawingNumber)}</strong></td>
          <td><strong>${escapeHtml(drawing.instanceMark || '—')}</strong></td>
          <td>${escapeHtml(drawing.revision)}</td>
          <td>${escapeHtml(drawing.description)}</td>
          <td>${escapeHtml(drawing.approvalStatus)}</td>
          <td><a class="drawing-pdf" href="/api/drawings/${drawing.drawingId}/pdf" target="_blank" rel="noopener">PDF</a></td>
        </tr>`).join('') : '<tr><td colspan="8">No drawings are assigned to this transmittal.</td></tr>';
    }

    function selectedDrawings() {
      const selectedKeys = new Set([...document.querySelectorAll('.drawing-check:checked')].map((input) => input.closest('tr').dataset.rowKey));
      return drawings.filter((drawing) => selectedKeys.has(drawing.rowKey));
    }

    function printDrawings(items) {
      if (!items.length) { window.alert('Select at least one drawing to print.'); return; }
      document.getElementById('qr-print-preview')?.remove();

      const preview = document.createElement('div');
      preview.id = 'qr-print-preview';
      preview.innerHTML = `
        <div class="qr-preview-backdrop"></div>
        <section class="qr-preview-panel drawing-preview-panel" role="dialog" aria-modal="true" aria-label="Assembly QR print preview">
          <button type="button" class="qr-preview-close" aria-label="Close preview">&times;</button>
          <div class="sheet">${items.map((drawing) => `
            <section class="label">
              <img src="${escapeHtml(drawing.qrUrl)}" alt="Assembly QR code for ${escapeHtml(drawing.instanceMark || drawing.drawingNumber)}">
              <div class="number">${escapeHtml(drawing.instanceMark || drawing.drawingNumber)}</div>
              <div class="qr-value">${escapeHtml(drawing.qrCode)}</div>
              <div class="description">${escapeHtml(drawing.description)}</div>
            </section>`).join('')}</div>
          <button type="button" class="print-button">Print</button>
        </section>`;
      document.body.appendChild(preview);

      const closePreview = () => preview.remove();
      preview.querySelector('.qr-preview-backdrop').addEventListener('click', closePreview);
      preview.querySelector('.qr-preview-close').addEventListener('click', closePreview);
      preview.querySelector('.print-button').addEventListener('click', () => {
        document.body.classList.add('printing-qr-preview');
        window.print();
      });
      window.addEventListener('afterprint', () => {
        document.body.classList.remove('printing-qr-preview');
        closePreview();
      }, { once: true });
    }

    document.getElementById('overview-nav').onclick = () => { window.location.href = `/project.html?job=${encodeURIComponent(jobNumber)}`; };
    document.getElementById('assemblies-nav').onclick = () => { window.location.href = `/assembly.html?job=${encodeURIComponent(jobNumber)}`; };
    document.getElementById('drawings-nav').onclick = () => { window.location.href = `/drawings.html?job=${encodeURIComponent(jobNumber)}`; };
    document.getElementById('fitup-report-nav').onclick = () => { window.location.href = `/fitup-report.html?job=${encodeURIComponent(jobNumber)}`; };
    document.getElementById('inspections-nav').onclick = () => { window.location.href = `/inspections.html?job=${encodeURIComponent(jobNumber)}`; };
    search.addEventListener('input', render);
    descriptionFilter.addEventListener('change', render);
    document.getElementById('select-all').onclick = () => { const checks = [...document.querySelectorAll('.drawing-check')]; const shouldSelect = checks.some((check) => !check.checked); checks.forEach((check) => { check.checked = shouldSelect; }); };
    document.getElementById('print-all').onclick = () => printDrawings(drawings);
    document.getElementById('print-selected').onclick = () => printDrawings(selectedDrawings());

    if (!jobNumber || !transmittalId) {
      title.textContent = 'Assigned drawings';
      rows.innerHTML = '<tr><td colspan="8">A project and transmittal are required.</td></tr>';
    } else {
      fetch(`/api/transmittal-drawings?job=${encodeURIComponent(jobNumber)}&transmittal=${encodeURIComponent(transmittalId)}`)
        .then(async (response) => { const payload = await response.json(); if (!response.ok) throw new Error(payload.error || 'Unable to load assigned drawings'); return payload; })
        .then((payload) => {
          drawings = payload.drawings || [];
          const descriptions = [...new Set(drawings.map((drawing) => String(drawing.description ?? '').trim()).filter(Boolean))].sort((first, second) => first.localeCompare(second));
          descriptionFilter.innerHTML = '<option value="">All descriptions</option>' + descriptions.map((description) => `<option value="${escapeHtml(description)}">${escapeHtml(description)}</option>`).join('');
          title.textContent = `${payload.jobNumber} Assigned Drawings (${drawings.length})`;
          render();
        })
        .catch((error) => { title.textContent = `${jobNumber} Assigned Drawings`; rows.innerHTML = `<tr><td colspan="8">${escapeHtml(error.message)}</td></tr>`; });
    }
  </script>
</body>
</html>
