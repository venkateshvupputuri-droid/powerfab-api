<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Access</title><link rel="stylesheet" href="/styles.css"><style>.access-table{width:100%;border-collapse:collapse}.access-table th,.access-table td{padding:10px;border-bottom:1px solid #c8ccd1;text-align:left}.access-table th{background:#d8d9df}.access-table button{background:#147eaf;color:#fff;border:0;padding:7px 14px;cursor:pointer}.access-error{color:#a21d1d}</style></head>
<body class="detail-page"><div class="page-shell project-shell"><header class="topbar detail-topbar"><div class="topbar-left"><div class="brand" title="Home" role="button" tabindex="0"><img class="adani-logo" src="/Adani_logo.png" alt="Adani"></div></div><div class="user-menu-wrap"><button class="user-button" type="button">User</button></div></header><main class="detail-content"><button id="back" class="secondary-button" type="button">Back</button><h1 class="project-title">User Access</h1><p id="message" role="status">Loading users...</p><div class="drawings-table-wrap"><table class="access-table"><thead><tr><th>User</th><th>Username</th><th>Active</th><th>Shift to Paint</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script>
const rows=document.getElementById('rows'),message=document.getElementById('message');document.getElementById('back').onclick=()=>location.href='/';document.querySelector('.brand').onclick=()=>location.href='/';
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function load(){const r=await fetch('/api/admin/feature-permissions');const p=await r.json();if(!r.ok)throw Error(p.error||'Unable to load user access.');rows.innerHTML=p.users.map(u=>`<tr><td>${esc(u.contractorName)}</td><td>${esc(u.username)}</td><td>${u.active?'Yes':'No'}</td><td><input type="checkbox" data-id="${u.id}" ${u.shiftToPaint?'checked':''} ${u.active?'':'disabled'}></td><td><button type="button" data-save="${u.id}">Save</button></td></tr>`).join('');message.textContent='';document.querySelectorAll('[data-save]').forEach(button=>button.onclick=async()=>{const id=button.dataset.save;const checkbox=document.querySelector(`[data-id="${id}"]`);const response=await fetch(`/api/admin/feature-permissions/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({shiftToPaint:checkbox.checked})});const payload=await response.json();message.textContent=response.ok?'Access saved.':payload.error||'Unable to save access.'})}load().catch(error=>{message.className='access-error';message.textContent=error.message});
</script></body></html>
