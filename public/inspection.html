<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assembly Inspection</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="detail-page">
  <div class="page-shell project-shell">
    <header class="topbar detail-topbar">
      <div class="topbar-left">
        <button class="menu-button" type="button" aria-label="Open menu">&#9776;</button>
        <div class="brand" aria-label="Adani" title="Adani" style="cursor: pointer;">
          <img class="adani-logo" src="/Adani_logo.png" alt="Adani">
        </div>
      </div>
      <div class="user-menu-wrap">
        <button class="user-button" type="button" aria-label="User profile" aria-expanded="false">◔</button>
        <div class="user-menu hidden" role="menu" aria-label="User menu">
          <button type="button" class="user-menu-item logout-menu-item">Logout</button>
        </div>
      </div>
    </header>
    <main class="detail-content">
      <div class="scan-shell">
        <button id="back-scan" type="button" class="secondary-button">Back to Scan</button>
        <h1 id="page-title" class="project-title">Assembly Inspection</h1>
        <div id="error-message" class="login-error" role="alert"></div>
        <div id="assembly-details" class="scan-result inspection-summary hidden">
          <div class="scan-status-row"><span class="scan-status-label">Job No</span><strong id="job-number">—</strong></div>
          <div class="scan-status-row"><span class="scan-status-label">Job Description</span><strong id="job-description">—</strong></div>
          <div class="scan-status-row"><span class="scan-status-label">Drawing No</span><strong id="drawing-number">—</strong></div>
          <div class="scan-status-row"><span class="scan-status-label">Instance Mark No</span><strong id="instance-mark-number">—</strong></div>
          <div class="scan-status-row"><span class="scan-status-label">Assembly Instance Weight</span><strong id="assembly-weight">—</strong></div>
        </div>
        <form id="inspection-form" class="fitup-panel hidden">
          <h2 id="inspection-heading">Vendor / Fit-up Inspection</h2>
          <div class="inspection-tabs" role="tablist">
            <button type="button" class="inspection-tab hidden" data-tab="subject">Test Subject</button>
            <button type="button" class="inspection-tab active" data-tab="data">Test Data</button>
            <button type="button" class="inspection-tab" data-tab="documents">Documents</button>
          </div>
          <section class="inspection-tab-panel hidden" data-panel="subject">
            <div class="inspection-field-grid">
              <label>Job #<input id="inspection-job" readonly></label>
              <label>Main Mark<input id="main-mark" readonly></label>
              <label>Piece Mark<input id="piece-mark"></label>
              <label>Sequence<input id="sequence"></label>
              <label>Lot #<input id="lot-number"></label>
              <label>Work Package #<input id="work-package"></label>
              <label>Quantity<input id="quantity" type="number" min="0" step="any"></label>
              <label>Available Instance Numbers<input id="available-instances" readonly></label>
              <label>Test Instance Numbers<input id="instance-number"></label>
              <label>Approval Status<input id="approval-status"></label>
            </div>
          </section>
          <section class="inspection-tab-panel active" data-panel="data">
            <div class="inspection-field-grid">
              <label>Test Performed<input id="test-performed" type="datetime-local"></label>
              <label>Location<select id="location" required></select></label>
              <label>Inspector<input id="inspector" required maxlength="255" autocomplete="name" readonly></label>
              <label>Inspector firm<input id="inspector-firm" readonly></label>
              <label>Test Hours<input id="test-hours" type="number" min="0" step="any"></label>
              <div id="inspection-fields" class="inspection-field-grid"></div>
              <label>Result<select id="result"><option>PASS</option><option>FAIL</option><option>HOLD</option><option>RE-INSPECTION REQUIRED</option></select></label>
            </div>
            <label>Remarks<textarea id="remarks" rows="5" maxlength="4000"></textarea></label>
          </section>
          <section class="inspection-tab-panel" data-panel="documents">
            <label>Attach Documents<input id="documents" type="file" multiple accept="image/*,.pdf,.txt,.doc,.docx"></label>
            <div id="document-list" class="document-list">No documents selected.</div>
          </section>
          <button type="submit" class="detail-button">Save Inspection</button>
          <p id="save-message" role="status"></p>
        </form>
        <section id="inspection-history" class="inspection-history hidden">
          <h2>Saved Inspection History</h2>
          <div id="history-list"></div>
        </section>
    </main>
  </div>
  <script src="/time.js"></script>
  <script>
    const qrCode = new URLSearchParams(window.location.search).get('qr') || '';
    const details = document.getElementById('assembly-details');
    const form = document.getElementById('inspection-form');
    const errorMessage = document.getElementById('error-message');
    const saveMessage = document.getElementById('save-message');
    let selectedDocuments = [];
    const historyPanel = document.getElementById('inspection-history');
    const historyList = document.getElementById('history-list');
    const escapeHtml = (value) => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const brand = document.querySelector('.brand');
    const userMenuWrap = document.querySelector('.user-menu-wrap');
    const userButton = userMenuWrap.querySelector('.user-button');
    const userMenu = userMenuWrap.querySelector('.user-menu');
    const logoutButton = userMenuWrap.querySelector('.logout-menu-item');

    brand.addEventListener('click', () => { window.location.href = '/'; });
    userButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const isHidden = userMenu.classList.toggle('hidden');
      userButton.setAttribute('aria-expanded', String(!isHidden));
    });
    logoutButton.addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } finally {
        window.location.href = '/';
      }
    });
    document.addEventListener('click', (event) => {
      if (!userMenuWrap.contains(event.target)) {
        userMenu.classList.add('hidden');
        userButton.setAttribute('aria-expanded', 'false');
      }
    });
    fetch('/api/auth/me').then(async (response) => {
      if (!response.ok) throw new Error('Not authenticated');
      const payload = await response.json();
      const displayName = payload.contractor?.contractorName || payload.contractor?.username || 'User';
      userButton.textContent = displayName;
      userButton.setAttribute('aria-label', `User profile: ${displayName}`);
    }).catch(() => {
      window.location.href = `/?return=${encodeURIComponent(window.location.pathname + window.location.search)}`;
    });

    document.getElementById('back-scan').onclick = () => { window.location.href = `/scan.html${qrCode ? `?qr=${encodeURIComponent(qrCode)}` : ''}`; };

    function lockInspectionForm() {
      form.querySelectorAll('input, select, textarea, button[type="submit"], input[type="file"]').forEach((field) => { field.disabled = true; });
      saveMessage.textContent = 'This inspection is already saved and locked.';
    }

    function updateQuantityFromInstances() {
      const instanceNumbers = document.getElementById('instance-number').value
        .split(',')
        .map((value) => Number(value.trim()))
        .filter((value, index, values) => Number.isInteger(value) && value > 0 && values.indexOf(value) === index);
      document.getElementById('quantity').value = instanceNumbers.length ? String(instanceNumbers.length) : '';
      return instanceNumbers;
    }

    function renderHistory(inspections) {
      historyList.innerHTML = inspections.map((inspection) => `<article class="inspection-history-item"><strong>${escapeHtml(inspection.result)}</strong><span>${escapeHtml(inspection.inspector)} · ${escapeHtml(inspection.createdAt)}</span><p>${escapeHtml(inspection.remarks || 'No remarks')}</p></article>`).join('');
      historyPanel.classList.remove('hidden');
    }

    function renderInspectionFields(fields) {
      const container = document.getElementById('inspection-fields');
      container.innerHTML = (fields || []).map((field) => `
        ${field.type.includes('bool') || field.type.includes('bit') || !field.options?.length
          ? `<label class="inspection-checkbox-label"><input type="checkbox" id="inspection-field-${escapeHtml(field.key)}" data-inspection-key="${escapeHtml(field.key)}" required><span>${escapeHtml(field.name)}</span></label>`
          : `<label>${escapeHtml(field.name)}<select id="inspection-field-${escapeHtml(field.key)}" data-inspection-key="${escapeHtml(field.key)}" required>
              <option value="">Select option</option>
              ${(field.options || []).map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`).join('')}
            </select></label>`}
      `).join('');
    }

    function getInspectionFieldValues() {
      return [...document.querySelectorAll('[data-inspection-key]')].reduce((values, field) => {
        values[field.dataset.inspectionKey] = field.type === 'checkbox' ? (field.checked ? 'Yes' : '') : field.value;
        return values;
      }, {});
    }

    async function loadInspection() {
      if (!qrCode) { errorMessage.textContent = 'Scan an assembly QR code first.'; return; }
      try {
        const response = await fetch(`/api/assemblies/${encodeURIComponent(qrCode)}/status`);
        const payload = await response.json();
        if (response.status === 401) {
          window.location.href = `/?return=${encodeURIComponent(window.location.pathname + window.location.search)}`;
          return;
        }
        if (!response.ok) throw new Error(payload.error || 'Unable to load this assembly.');
        document.getElementById('page-title').textContent = `Inspection - ${payload.assemblyMark || qrCode}`;
        document.getElementById('job-number').textContent = payload.jobNumber || '—';
        document.getElementById('job-description').textContent = payload.jobDescription || '—';
        document.getElementById('drawing-number').textContent = payload.drawingNumber || '—';
        document.getElementById('instance-mark-number').textContent = payload.instanceMark || '—';
        document.getElementById('assembly-weight').textContent = `${Number(payload.assemblyWeight || 0).toLocaleString(undefined, { maximumFractionDigits: 3 })} kg`;
        document.getElementById('inspection-heading').textContent = payload.inspectionRole === 'PAINTING_INSPECTION'
          ? 'Painting Inspection'
          : payload.inspectionRole === 'CLIENT_FITUP'
            ? 'Client / Fit-up Inspection'
            : 'Vendor / Fit-up Inspection';
        document.getElementById('inspection-job').value = payload.jobNumber || '';
        document.getElementById('main-mark').value = payload.assemblyMark || '';
        document.getElementById('available-instances').value = (payload.availableInstanceNumbers || []).join(', ');
        document.getElementById('instance-number').value = payload.instanceNumber ? String(payload.instanceNumber) : '';
        document.getElementById('test-performed').value = indiaDateTimeInputValue();
        renderInspectionFields(payload.inspectionFields);
        const locationSelect = document.getElementById('location');
        locationSelect.innerHTML = '<option value="">Select location</option>' + (payload.inspectionLocations || []).map(location => `<option value="${escapeHtml(location.id)}">${escapeHtml(location.name)}</option>`).join('');
        locationSelect.value = payload.inspectionLocations?.find(location => String(location.name).toLowerCase().includes(payload.inspectionRole === 'PAINTING_INSPECTION' ? 'painting' : 'fab-shop'))?.id || '';
        document.getElementById('inspector').value = payload.inspector?.name || payload.inspector?.username || '';
        document.getElementById('inspector-firm').value = payload.inspector?.firmName || '';
        details.classList.remove('hidden');
        form.classList.remove('hidden');
        document.getElementById('inspector').focus();

        const existingResponse = await fetch(`/api/assemblies/${encodeURIComponent(qrCode)}/fitup-inspections`);
        if (existingResponse.ok) {
          const existing = await existingResponse.json();
          renderHistory(existing.inspections || []);
          const stored = existing.inspections?.[0]?.checks || {};
          const previous = typeof stored === 'string' ? JSON.parse(stored) : stored;
          Object.entries(previous).forEach(([key, value]) => {
            const field = document.getElementById(key === 'instanceNumber' ? 'instance-number' : key);
            if (field && typeof value === 'string') field.value = value;
          });
          updateQuantityFromInstances();
          if (existing.inspectionComplete) lockInspectionForm();
          else if (existing.inspections?.length) {
            saveMessage.textContent = `Inspection progress: ${(existing.completedInstanceNumbers || []).length} of ${(existing.availableInstanceNumbers || []).length} instances completed. You can save the remaining instances.`;
          }
        }
      } catch (error) {
        errorMessage.textContent = error.message || 'Unable to load inspection.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) {
        saveMessage.textContent = 'Please tick or select every test option before saving.';
        return;
      }
      saveMessage.textContent = 'Saving...';
      try {
        const response = await fetch(`/api/assemblies/${encodeURIComponent(qrCode)}/fitup-inspections`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            inspector: document.getElementById('inspector').value.trim(),
            result: document.getElementById('result').value,
            remarks: document.getElementById('remarks').value.trim(),
            checks: {
              jobNumber: document.getElementById('inspection-job').value,
              mainMark: document.getElementById('main-mark').value,
              pieceMark: document.getElementById('piece-mark').value,
              sequence: document.getElementById('sequence').value,
              lotNumber: document.getElementById('lot-number').value,
              workPackage: document.getElementById('work-package').value,
              quantity: document.getElementById('quantity').value,
              instanceNumber: document.getElementById('instance-number').value,
              approvalStatus: document.getElementById('approval-status').value,
              testPerformed: document.getElementById('test-performed').value,
              location: document.getElementById('location').selectedOptions[0]?.textContent || '',
              inspectionLocationId: document.getElementById('location').value,
              testHours: document.getElementById('test-hours').value,
              ...getInspectionFieldValues(),
              documents: selectedDocuments,
            }
          })
        });
        const payload = await response.json();
        if (response.status === 401) {
          window.location.href = `/?return=${encodeURIComponent(window.location.pathname + window.location.search)}`;
          return;
        }
        if (!response.ok) throw new Error(payload.error || 'Unable to save inspection.');
        const progressResponse = await fetch(`/api/assemblies/${encodeURIComponent(qrCode)}/fitup-inspections`);
        const progress = progressResponse.ok ? await progressResponse.json() : null;
        if (progress?.inspections) renderHistory(progress.inspections);
        if (progress?.inspectionComplete) {
          lockInspectionForm();
        } else {
          const inspectedCount = (progress?.completedInstanceNumbers || []).length;
          const totalCount = (progress?.availableInstanceNumbers || []).length;
          saveMessage.textContent = payload.result === 'FAIL'
            ? `Inspection saved: FAIL. ${inspectedCount} of ${totalCount} instances inspected. This instance can be scanned again.`
            : `Inspection saved: PASS. ${inspectedCount} of ${totalCount} instances completed. Continue with the remaining instances.`;
        }
      } catch (error) {
        saveMessage.textContent = error.message || 'Unable to save inspection.';
      }
    });

    document.getElementById('instance-number').addEventListener('input', updateQuantityFromInstances);

    document.querySelectorAll('.inspection-tab').forEach((tab) => tab.addEventListener('click', () => {
      document.querySelectorAll('.inspection-tab, .inspection-tab-panel').forEach((element) => element.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    }));

    document.getElementById('documents').addEventListener('change', async (event) => {
      selectedDocuments = await Promise.all([...event.target.files].map((file) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, type: file.type, size: file.size, data: reader.result });
        reader.readAsDataURL(file);
      })));
      document.getElementById('document-list').textContent = selectedDocuments.map((file) => `${file.name} (${file.size} bytes)`).join(', ') || 'No documents selected.';
    });

    loadInspection();
  </script>
</body>
</html>
