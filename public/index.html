<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tekla PowerFab Go</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <div class="brand" aria-label="Tekla PowerFab Go">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-mark-inner"></span>
          </div>
          <div class="brand-text">
            <span class="tekla">Tekla</span>
            <span class="powerfab">PowerFab</span>
            <span class="go">Go</span>
          </div>
        </div>
      </div>
      <button class="user-button" type="button" aria-label="User profile">◔</button>
    </header>

    <main class="content-panel">
      <div class="landing-actions">
        <button id="projects-open" class="primary-action" type="button">
          Projects
        </button>

        <button id="connect-powerfab" class="secondary-action" type="button">
          Connect PowerFab
        </button>
      </div>
    </main>

    <section id="projects-page" class="projects-page hidden" aria-live="polite">
      <div class="toolbar">
        <div class="toolbar-icon" aria-hidden="true">☰</div>

        <label class="field-control">
          <span class="sr-only">Site</span>
          <select id="toolbar-site-select">
            <option value="">Site (job location)</option>
          </select>
        </label>

        <label class="field-control">
          <span class="sr-only">Plant</span>
          <select id="toolbar-plant-select">
            <option value="">Plant from (group)</option>
          </select>
        </label>

        <label class="field-control">
          <span class="sr-only">Unit</span>
          <select id="toolbar-unit-select">
            <option value="">Unit from (group2)</option>
          </select>
        </label>

        <label class="field-control field-control-search">
          <span class="sr-only">Find Job</span>
          <input id="job-search" type="text" placeholder="Find Job..." autocomplete="off">
        </label>
      </div>

      <div class="job-table" role="table" aria-label="Projects table">
        <div class="table-head" role="row">
          <span role="columnheader">Job No.</span>
          <span role="columnheader">Description</span>
          <span role="columnheader">Location</span>
        </div>

        <div id="job-rows" class="job-rows"></div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
