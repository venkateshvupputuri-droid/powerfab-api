<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transmittals</title><link rel="stylesheet" href="/styles.css"></head>
<body class="detail-page"><div class="page-shell project-shell">
<header class="topbar detail-topbar"><div class="topbar-left"><button class="menu-button" type="button" aria-label="Open menu">â˜°</button><div class="brand" aria-label="Adani Fab & Erection Tracker" title="Adani Fab & Erection Tracker" style="cursor:pointer"><div class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></div><div class="brand-text"><span class="tekla">Adani</span><span class="powerfab">Fab &amp; Erection</span><span class="go">Tracker</span></div></div></div><div class="user-menu-wrap"><button class="user-button" type="button" aria-label="User profile" aria-expanded="false">â—”</button><div class="user-menu hidden" role="menu" aria-label="User menu"><button type="button" class="user-menu-item logout-menu-item">Logout</button></div></div></header>
<nav class="project-nav"><button class="project-nav-item" id="overview-nav">OVERVIEW</button><button class="project-nav-item" id="drawings-nav">DRAWINGS</button><button class="project-nav-item active">TRANSMITTALS</button><button class="project-nav-item" id="inspections-nav">INSPECTIONS</button></nav>
<main class="detail-content drawings-content"><h1 id="page-title" class="project-title">Loading transmittals...</h1><div class="drawings-toolbar"><strong>Assigned transmittals</strong><input id="transmittal-search" type="search" placeholder="Search..." aria-label="Search transmittals"></div><div class="drawings-table-wrap"><table class="drawings-table"><thead><tr><th>Transmittal #</th><th>Date</th><th>Title</th><th>Firm</th><th>Attention</th><th>Sent By</th><th>Drawings</th><th>Outstanding</th><th>Received</th></tr></thead><tbody id="rows"><tr><td colspan="9">Loading...</td></tr></tbody></table></div></main>
</div><script src="/time.js"></script><script>
const params=new URLSearchParams(location.search),job=params.get('job')||'',title=document.getElementById('page-title'),rows=document.getElementById('rows'),search=document.getElementById('transmittal-search');let data=[];
const esc=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const displayValue=value=>value===null||value===undefined||String(value).trim()===''?'-':value;
const displayDate=value=>value?formatIndiaDateTime(value):'-';
function render(){const q=search.value.toLowerCase().trim();const list=data.filter(x=>`${x.TransmittalNumber||''} ${x.Title||''} ${x.firmName||''}`.toLowerCase().includes(q));rows.innerHTML=list.length?list.map(x=>`<tr><td><a class="transmittal-link" href="/transmittal-drawings.html?job=${encodeURIComponent(job)}&transmittal=${encodeURIComponent(x.TransmittalID)}"><strong>${esc(displayValue(x.TransmittalNumber))}</strong></a></td><td>${esc(displayDate(x.TransmittalDate))}</td><td>${esc(displayValue(x.Title))}</td><td>${esc(displayValue(x.firmName))}</td><td>${esc(displayValue(x.Attn))}</td><td>${esc(displayValue(x.SentBy))}</td><td>${x.NumberOfDrawings??0}</td><td>${x.NumberOfOutstandingDrawings??0}</td><td>${esc(displayDate(x.LastDateReceived))}</td></tr>`).join(''):'<tr><td colspan="9">No assigned transmittals found.</td></tr>';}
document.getElementById('overview-nav').onclick=()=>location.href=`/project.html?job=${encodeURIComponent(job)}`;document.getElementById('drawings-nav').onclick=()=>location.href=`/drawings.html?job=${encodeURIComponent(job)}`;document.getElementById('inspections-nav').onclick=()=>location.href=`/inspections.html?job=${encodeURIComponent(job)}`;document.querySelector('.brand').onclick=()=>location.href='/';search.oninput=render;const userMenuWrap=document.querySelector('.user-menu-wrap'),userButton=userMenuWrap.querySelector('.user-button'),userMenu=userMenuWrap.querySelector('.user-menu'),logoutButton=userMenuWrap.querySelector('.logout-menu-item');userButton.onclick=event=>{event.stopPropagation();const hidden=userMenu.classList.toggle('hidden');userButton.setAttribute('aria-expanded',String(!hidden));};logoutButton.onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/'}};document.addEventListener('click',event=>{if(!userMenuWrap.contains(event.target)){userMenu.classList.add('hidden');userButton.setAttribute('aria-expanded','false')}});fetch('/api/auth/me').then(async r=>{if(!r.ok)throw Error('Not authenticated');const p=await r.json();const name=p.contractor?.contractorName||p.contractor?.username||'User';userButton.textContent=name;userButton.setAttribute('aria-label',`User profile: ${name}`)}).catch(()=>{location.href=`/?return=${encodeURIComponent(location.pathname+location.search)}`});fetch(`/api/project-transmittals?job=${encodeURIComponent(job)}`).then(async r=>{const p=await r.json();if(!r.ok)throw Error(p.error||'Unable to load transmittals');return p}).then(p=>{data=p.transmittals||[];title.textContent=`${p.jobNumber} Transmittals (${data.length})`;render()}).catch(e=>{title.textContent=`${job} Transmittals`;rows.innerHTML=`<tr><td colspan="9">${esc(e.message)}</td></tr>`});
</script></body></html>
