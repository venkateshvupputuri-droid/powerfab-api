services:
  - type: web
    name: powerfab-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: powerfab-api
          property: url
